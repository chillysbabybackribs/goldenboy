<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tool Runtime</title>
  <style>
    body { background: #000; color: #888; font-family: monospace; font-size: 12px; padding: 16px; }
    #status { color: #00d47b; margin-bottom: 8px; }
    #log { white-space: pre; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="status">Initializing tool runtime...</div>
  <div id="log"></div>
<script>
  const api = window.workspaceAPI;
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');

  function log(msg) {
    logEl.textContent += new Date().toISOString().slice(11,23) + ' ' + msg + '\n';
  }

  if (!api) {
    statusEl.textContent = 'ERROR: workspaceAPI not available';
    statusEl.style.color = '#ee4444';
    throw new Error('workspaceAPI not available — page must run inside the app browser');
  }

  // ── Tool implementations ────────────────────────────────────────────────

  window.tools = {
    browser: {
      get_state:              ()      => api.browser.getState(),
      get_tabs:               ()      => api.browser.getTabs(),
      capture_snapshot:       (i)     => api.browser.captureTabSnapshot(i.tabId),
      get_actionable_elements:(i)     => api.browser.getActionableElements(i.tabId),
      get_form_model:         (i)     => api.browser.getFormModel(i.tabId),
      get_console_events:     (i)     => api.browser.getConsoleEvents(i.tabId, i.since),
      get_network_events:     (i)     => api.browser.getNetworkEvents(i.tabId, i.since),
      get_downloads:          ()      => api.browser.getDownloads(),
      get_bookmarks:          ()      => api.browser.getBookmarks(),
      add_bookmark:           (i)     => api.browser.addBookmark(i.url, i.title),
      remove_bookmark:        (i)     => api.browser.removeBookmark(i.bookmarkId),
      get_settings:           ()      => api.browser.getSettings(),
      update_settings:        (i)     => api.browser.updateSettings(i.settings),
      get_extensions:         ()      => api.browser.getExtensions(),
      split_tab:              (i)     => api.browser.splitTab(i.tabId),
      clear_split_view:       ()      => api.browser.clearSplitView(),
      zoom_in:                ()      => api.browser.zoomIn(),
      zoom_out:               ()      => api.browser.zoomOut(),
      zoom_reset:             ()      => api.browser.zoomReset(),
      toggle_devtools:        ()      => api.browser.toggleDevTools(),
      find_in_page:           (i)     => api.browser.findInPage(i.query),
      find_next:              ()      => api.browser.findNext(),
      find_previous:          ()      => api.browser.findPrevious(),
      stop_find:              ()      => api.browser.stopFind(),
      cancel_download:        (i)     => api.browser.cancelDownload(i.downloadId),
      clear_downloads:        ()      => api.browser.clearDownloads(),
      clear_history:          ()      => api.browser.clearHistory(),
      clear_data:             ()      => api.browser.clearData(),
      reimport_cookies:       ()      => api.browser.reimportCookies(),
      // Surface actions (navigation, interaction)
      navigate:               (i)     => api.actions.submit({ type: 'browser.navigate', url: i.url, tabId: i.tabId }),
      navigate_to:            (i)     => api.actions.submit({ type: 'browser.navigate_to', target: i.target, tabId: i.tabId }),
      search_web:             (i)     => api.actions.submit({ type: 'browser.search_web', query: i.query }),
      back:                   (i)     => api.actions.submit({ type: 'browser.back', tabId: i.tabId }),
      forward:                (i)     => api.actions.submit({ type: 'browser.forward', tabId: i.tabId }),
      reload:                 (i)     => api.actions.submit({ type: 'browser.reload', tabId: i.tabId }),
      create_tab:             (i)     => api.actions.submit({ type: 'browser.create_tab', url: i.url }),
      close_tab:              (i)     => api.actions.submit({ type: 'browser.close_tab', tabId: i.tabId }),
      activate_tab:           (i)     => api.actions.submit({ type: 'browser.activate_tab', tabId: i.tabId }),
      click:                  (i)     => api.actions.submit({ type: 'browser.click', selector: i.selector, tabId: i.tabId }),
      type:                   (i)     => api.actions.submit({ type: 'browser.type', selector: i.selector, text: i.text, tabId: i.tabId }),
      wait_for:               (i)     => api.actions.submit({ type: 'browser.wait_for', selector: i.selector, tabId: i.tabId }),
    },

    filesystem: {
      read:   (i) => api.fs.read(i.path),
      write:  (i) => api.fs.write(i.path, i.content),
      exists: (i) => api.fs.exists(i.path),
      list:   (i) => api.fs.list(i.path),
      delete: (i) => api.fs.delete(i.path),
      mkdir:  (i) => api.fs.mkdir(i.path),
    },

    terminal: {
      write: (i) => api.terminal.write(i.data),
    },

    model: {
      invoke:   (i) => api.model.invoke(i.taskId, i.prompt, i.owner, i.options),
      cancel:   (i) => api.model.cancel(i.taskId),
      resolve:  (i) => api.model.resolve(i.prompt, i.owner, i.options),
    },
  };

  // ── Batch execution helper ──────────────────────────────────────────────
  // Returns { ok, result } or { ok: false, error } per call.
  // Batch results are written to disk — evaluate_js returns only a
  // confirmation string so constraint validator never sees raw batch output.

  window.runTool = async (category, name, input) => {
    try {
      const fn = window.tools[category]?.[name];
      if (!fn) return { ok: false, error: `Unknown tool: ${category}.${name}` };
      const result = await fn(input ?? {});
      return { ok: true, result };
    } catch (err) {
      return { ok: false, error: err instanceof Error ? err.message : String(err) };
    }
  };

  window.runBatch = async (calls, outPath) => {
    const results = await Promise.all(
      calls.map(({ category, name, input }) => window.runTool(category, name, input))
    );
    if (outPath) {
      await api.fs.write(outPath, JSON.stringify(results, null, 2));
      return `wrote ${results.length} results to ${outPath}`;
    }
    return results;
  };

  // ── Ready ───────────────────────────────────────────────────────────────

  const categories = Object.keys(window.tools);
  const toolCount = categories.reduce((n, cat) => n + Object.keys(window.tools[cat]).length, 0);
  statusEl.textContent = `Tool runtime ready — ${toolCount} tools across ${categories.length} categories`;
  log(`categories: ${categories.join(', ')}`);
  log(`window.runTool(category, name, input) — single tool`);
  log(`window.runBatch(calls, outPath?) — parallel batch, optionally writes to disk`);
</script>
</body>
</html>
