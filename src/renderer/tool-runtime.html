<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debug Only: Tool Runtime Disabled</title>
  <style>
    body { background: #000; color: #888; font-family: monospace; font-size: 12px; padding: 16px; }
    #status { color: #00d47b; margin-bottom: 8px; }
    #log { white-space: pre; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="status">Debug only: renderer tool runtime disabled</div>
  <div id="log"></div>
<script>
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');

  function log(msg) {
    logEl.textContent += new Date().toISOString().slice(11, 23) + ' ' + msg + '\n';
  }

  statusEl.style.color = '#ee4444';
  log('Provider-centric tool execution is active.');
  log('Renderer tool invocation is disabled.');
  log('Use the provider tool runtime through agentToolExecutor.');
</script>
</body>
</html>
