<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FS Bridge Test</title>
  <style>
    :root {
      --bg: #000;
      --bg2: #0a0a0a;
      --bg3: #111;
      --border: #1a1a1a;
      --border-active: #333;
      --text: #ededed;
      --muted: #888;
      --green: #00d47b;
      --red: #ee4444;
      --orange: #ff9500;
      --cyan: #22d3ee;
      --mono: 'Geist Mono', 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 13px; font-weight: 500; color: var(--text); }
    header span { font-size: 11px; color: var(--muted); }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--green); }
    .status-dot.err { background: var(--red); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1px;
      flex: 1;
      background: var(--border);
      overflow: hidden;
    }

    .panel {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
    }

    .panel-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .panel-body { padding: 14px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    input, textarea {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 10px;
      width: 100%;
      outline: none;
      transition: border-color 120ms;
    }
    input:focus, textarea:focus { border-color: var(--border-active); }
    textarea { resize: vertical; min-height: 80px; }

    label { font-size: 11px; color: var(--muted); margin-bottom: 2px; display: block; }

    button {
      background: #1a1a1a;
      border: 1px solid var(--border-active);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 120ms;
      white-space: nowrap;
    }
    button:hover { background: #222; }
    button:active { background: #2a2a2a; }

    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row input { flex: 1; }

    .result {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.6;
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
      color: var(--muted);
    }

    .result.success { border-color: #1a3a2a; color: var(--green); }
    .result.error { border-color: #3a1a1a; color: var(--red); }
    .result.info { border-color: #1a2a3a; color: var(--cyan); }

    .log-panel {
      grid-column: 1 / -1;
    }

    .log-entries {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry {
      font-size: 11px;
      line-height: 1.5;
      padding: 4px 8px;
      border-radius: 3px;
      border-left: 2px solid transparent;
    }
    .log-entry.ok { border-color: var(--green); color: var(--green); background: rgba(0,212,123,0.04); }
    .log-entry.err { border-color: var(--red); color: var(--red); background: rgba(238,68,68,0.04); }
    .log-entry.info { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,0.04); }
    .log-entry.warn { border-color: var(--orange); color: var(--orange); background: rgba(255,149,0,0.04); }

    .ts { opacity: 0.5; margin-right: 8px; }

    .clear-btn {
      font-size: 10px;
      padding: 3px 8px;
      color: var(--muted);
      border-color: var(--border);
      background: transparent;
    }
  </style>
</head>
<body>

<header>
  <div class="status-dot" id="bridgeDot"></div>
  <h1>FS Bridge Test</h1>
  <span id="bridgeStatus">checking...</span>
</header>

<div class="layout">

  <!-- WRITE -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Write File</span>
    </div>
    <div class="panel-body">
      <div>
        <label>File path</label>
        <input id="writePath" type="text" value="/tmp/fs-bridge-test/hello.txt" />
      </div>
      <div>
        <label>Content</label>
        <textarea id="writeContent">Hello from the FS bridge!
Written at: {time}

This file was created by window.workspaceAPI.fs.write()
running inside the Electron renderer via IPC → Node.js fs.</textarea>
      </div>
      <button id="writeBtn">Write File</button>
      <div class="result" id="writeResult">—</div>
    </div>
  </div>

  <!-- READ -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Read File</span>
    </div>
    <div class="panel-body">
      <div>
        <label>File path</label>
        <div class="row">
          <input id="readPath" type="text" value="/tmp/fs-bridge-test/hello.txt" />
          <button id="readBtn">Read</button>
        </div>
      </div>
      <div>
        <label>Exists check</label>
        <div class="row">
          <input id="existsPath" type="text" value="/tmp/fs-bridge-test/hello.txt" />
          <button id="existsBtn">Exists?</button>
        </div>
      </div>
      <div class="result" id="readResult">—</div>
    </div>
  </div>

  <!-- LIST -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">List Directory</span>
    </div>
    <div class="panel-body">
      <div>
        <label>Directory path</label>
        <div class="row">
          <input id="listPath" type="text" value="/tmp/fs-bridge-test" />
          <button id="listBtn">List</button>
        </div>
      </div>
      <div>
        <label>Delete path</label>
        <div class="row">
          <input id="deletePath" type="text" value="/tmp/fs-bridge-test/hello.txt" />
          <button id="deleteBtn">Delete</button>
        </div>
      </div>
      <div class="result" id="listResult">—</div>
    </div>
  </div>

  <!-- LOG -->
  <div class="panel log-panel">
    <div class="panel-header">
      <span class="panel-title">Activity Log</span>
      <button class="clear-btn" id="clearLog">Clear</button>
    </div>
    <div class="log-entries" id="logEntries"></div>
  </div>

</div>

<script>
  const api = window.workspaceAPI?.fs;
  const dot = document.getElementById('bridgeDot');
  const statusEl = document.getElementById('bridgeStatus');

  if (api) {
    dot.className = 'status-dot ok';
    statusEl.textContent = 'window.workspaceAPI.fs is available';
  } else {
    dot.className = 'status-dot err';
    statusEl.textContent = 'window.workspaceAPI.fs NOT found — is this page loaded inside the app?';
  }

  function ts() {
    return new Date().toISOString().slice(11, 23);
  }

  function log(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `log-entry ${type}`;
    el.innerHTML = `<span class="ts">${ts()}</span>${msg}`;
    const container = document.getElementById('logEntries');
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  function setResult(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = `result ${type}`;
  }

  document.getElementById('clearLog').onclick = () => {
    document.getElementById('logEntries').innerHTML = '';
  };

  // ── Write ──────────────────────────────────────────────────────────────────

  document.getElementById('writeBtn').onclick = async () => {
    if (!api) { log('Bridge not available', 'err'); return; }
    const filePath = document.getElementById('writePath').value.trim();
    const raw = document.getElementById('writeContent').value;
    const content = raw.replace('{time}', new Date().toISOString());

    log(`fs.write → ${filePath}`, 'info');
    try {
      await api.write(filePath, content);
      setResult('writeResult', `Written ${content.length} chars to:\n${filePath}`, 'success');
      log(`Write OK — ${content.length} chars`, 'ok');
    } catch (err) {
      setResult('writeResult', String(err), 'error');
      log(`Write FAILED: ${err}`, 'err');
    }
  };

  // ── Read ───────────────────────────────────────────────────────────────────

  document.getElementById('readBtn').onclick = async () => {
    if (!api) { log('Bridge not available', 'err'); return; }
    const filePath = document.getElementById('readPath').value.trim();

    log(`fs.read → ${filePath}`, 'info');
    try {
      const content = await api.read(filePath);
      setResult('readResult', content, 'success');
      log(`Read OK — ${content.length} chars`, 'ok');
    } catch (err) {
      setResult('readResult', String(err), 'error');
      log(`Read FAILED: ${err}`, 'err');
    }
  };

  // ── Exists ─────────────────────────────────────────────────────────────────

  document.getElementById('existsBtn').onclick = async () => {
    if (!api) { log('Bridge not available', 'err'); return; }
    const filePath = document.getElementById('existsPath').value.trim();

    log(`fs.exists → ${filePath}`, 'info');
    try {
      const exists = await api.exists(filePath);
      setResult('readResult', `exists: ${exists}\n${filePath}`, exists ? 'success' : 'error');
      log(`Exists check: ${exists}`, exists ? 'ok' : 'warn');
    } catch (err) {
      setResult('readResult', String(err), 'error');
      log(`Exists FAILED: ${err}`, 'err');
    }
  };

  // ── List ───────────────────────────────────────────────────────────────────

  document.getElementById('listBtn').onclick = async () => {
    if (!api) { log('Bridge not available', 'err'); return; }
    const dirPath = document.getElementById('listPath').value.trim();

    log(`fs.list → ${dirPath}`, 'info');
    try {
      const entries = await api.list(dirPath);
      const lines = entries.map(e => `${e.isDirectory ? '📁' : '📄'} ${e.name}`).join('\n') || '(empty directory)';
      setResult('listResult', `${entries.length} entries in ${dirPath}:\n\n${lines}`, 'success');
      log(`List OK — ${entries.length} entries`, 'ok');
    } catch (err) {
      setResult('listResult', String(err), 'error');
      log(`List FAILED: ${err}`, 'err');
    }
  };

  // ── Delete ─────────────────────────────────────────────────────────────────

  document.getElementById('deleteBtn').onclick = async () => {
    if (!api) { log('Bridge not available', 'err'); return; }
    const filePath = document.getElementById('deletePath').value.trim();

    log(`fs.delete → ${filePath}`, 'info');
    try {
      await api.delete(filePath);
      setResult('listResult', `Deleted:\n${filePath}`, 'success');
      log(`Delete OK`, 'ok');
    } catch (err) {
      setResult('listResult', String(err), 'error');
      log(`Delete FAILED: ${err}`, 'err');
    }
  };

  log('Page loaded — bridge ' + (api ? 'connected' : 'NOT available'), api ? 'ok' : 'err');
</script>
</body>
</html>
